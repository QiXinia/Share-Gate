<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share-Gate · 共享桌面</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262b38; --accent:#10a37f; --text:#e7e9ee; --muted:#9aa0ad; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  /* ---------- Login ---------- */
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .card { width:360px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:28px; }
  .card h1 { font-size:20px; margin:0 0 4px; }
  .card p.sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .field { margin-bottom:12px; }
  .field input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:#0f1218; color:var(--text); font-size:14px; outline:none; }
  .field input:focus { border-color:var(--accent); }
  .btn { width:100%; padding:11px; border:0; border-radius:10px; font-size:14px; font-weight:600;
    cursor:pointer; background:var(--accent); color:#fff; }
  .btn.secondary { background:#2a2f3d; color:var(--text); margin-top:10px; }
  .btn.dingtalk { background:#1677ff; display:flex; align-items:center; gap:8px; justify-content:center; }
  .divider { text-align:center; color:var(--muted); font-size:12px; margin:16px 0; }
  .err { color:#ff6b6b; font-size:13px; min-height:18px; margin-bottom:6px; }
  /* ---------- App ---------- */
  #app { display:none; flex-direction:column; height:100%; }
  #toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel);
    border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; }
  .tab { padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:transparent;
    color:var(--muted); cursor:pointer; font-size:13px; }
  .tab.active { color:#fff; background:var(--accent); border-color:var(--accent); }
  .spacer { flex:1; }
  .tool-btn { padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#222736;
    color:var(--text); cursor:pointer; font-size:13px; }
  .tool-btn:hover { border-color:var(--accent); }
  #user { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  #user img { width:24px; height:24px; border-radius:50%; }
  #stage { flex:1; position:relative; overflow:hidden; background:#0b0d12; outline:none; }
  /* High-fidelity pixel mode */
  #screen { background:#fff; position:absolute; inset:0; width:100%; height:100%;
    box-shadow:0 0 0 1px var(--line); display:none; }
  #capture { position:absolute; inset:0; width:100%; height:100%; opacity:0; resize:none; z-index:4;
    caret-color:transparent; border:0; background:transparent; color:transparent; cursor:default;
    outline:none; display:none; }
  body.mode-stream #screen, body.mode-stream #capture { display:block; }
  /* DOM-mirror (PhantomStream) interaction overlay. The viewer's own iframe
     sits below (z-index 1) and is script-sandboxed; this div forwards input. */
  #poverlay { position:absolute; inset:0; z-index:6; display:none;
    pointer-events:none; cursor:default; }
  body.mode-dom #poverlay { display:block; }
  #stage.control-active #poverlay { pointer-events:auto; cursor:text; }
  /* click feedback ring */
  .ps-ring { position:absolute; width:26px; height:26px; border:2px solid var(--accent);
    border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:7;
    animation:psring .45s ease-out forwards; }
  @keyframes psring { from{opacity:.9; transform:translate(-50%,-50%) scale(.6);}
    to{opacity:0; transform:translate(-50%,-50%) scale(1.4);} }
  #statusbar { position:absolute; top:10px; left:50%; transform:translateX(-50%); padding:6px 14px;
    border-radius:20px; background:rgba(20,23,31,.9); border:1px solid var(--line); font-size:12px;
    color:var(--muted); z-index:9; pointer-events:none; }
  #statusbar.ok { color:#5fe0b0; }
  #statusbar.err { color:#ff8585; }
</style>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="card">
      <h1>Share-Gate 共享桌面</h1>
      <p class="sub">登录后使用 1:1 的 ChatGPT / Gemini 网页，每个用户独立对话。</p>
      <div class="err" id="loginErr"></div>
      <a id="dtBtn" class="btn dingtalk" href="/auth/dingtalk/login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.5 2 2 6 2 11c0 2.7 1.4 5.1 3.6 6.7l-.9 3.3 3.6-1.9c.9.2 1.8.4 2.7.4h.4A8.5 8.5 0 0 1 11 17c0-4.5 4.3-8.1 9.6-8.1h.4C19.9 5 16.3 2 12 2z"/><path d="M22 17c0-3.3-3.2-6-7.1-6S7.8 13.7 7.8 17s3.2 6 7.1 6c.8 0 1.6-.1 2.3-.4l2.5 1.3-.6-2.2C21 20.3 22 18.7 22 17z"/></svg>
        钉钉扫码登录
      </a>
      <div class="divider">或使用账号密码</div>
      <div class="field"><input id="u" placeholder="用户名" autocomplete="username"></div>
      <div class="field"><input id="p" type="password" placeholder="密码" autocomplete="current-password"></div>
      <button class="btn" id="loginBtn">登录</button>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <div id="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="spacer"></div>
      <button class="tool-btn" id="modeBtn" title="切换省流(DOM) / 高清(像素) 模式">省流模式</button>
      <button class="tool-btn" id="newChat">＋ 新对话</button>
      <button class="tool-btn" id="reload">⟳ 刷新</button>
      <div id="user"><span id="nick"></span><img id="avatar" alt="" style="display:none"></div>
      <button class="tool-btn" id="logoutBtn">退出</button>
    </div>
    <div id="stage" tabindex="0">
      <canvas id="screen"></canvas>
      <textarea id="capture" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false"></textarea>
      <div id="poverlay" aria-hidden="true"></div>
      <div id="statusbar">正在连接…</div>
    </div>
  </div>

<script type="module">
const $ = (id) => document.getElementById(id);
let me = null, platform = null, mode = 'dom';
const platformLabels = {};
const VENDOR = '/static/vendor/phantom-stream';
const stage = $('stage');

// ---------------- Auth ----------------
async function loadMe() {
  const r = await fetch('/auth/me').catch(() => null);
  if (r && r.ok) { me = await r.json(); return true; }
  return false;
}
function showLogin() {
  $('login').style.display = 'flex';
  $('app').style.display = 'none';
  if (new URLSearchParams(location.search).get('login_error'))
    $('loginErr').textContent = '钉钉登录失败或被取消，请重试';
}
function showApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  $('nick').textContent = me.display_name || me.username;
  if (me.avatar) { $('avatar').src = me.avatar; $('avatar').style.display='block'; }
  Object.assign(platformLabels, me.platform_labels || {});
  const list = me.platforms && me.platforms.length ? me.platforms : ['chatgpt'];
  $('tabs').innerHTML = '';
  list.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.dataset.platform = p;
    b.textContent = platformLabels[p] || p;
    b.onclick = () => switchPlatform(p);
    $('tabs').appendChild(b);
  });
  const initial = list.includes(new URLSearchParams(location.search).get('platform'))
    ? new URLSearchParams(location.search).get('platform') : list[0];
  fetch('/api/desktop-config').then(r => r.ok ? r.json() : null)
    .then(cfg => { if (cfg && cfg.default_mode) applyMode(cfg.default_mode); })
    .catch(() => {})
    .finally(() => { platform = initial; switchPlatform(initial); });
}
async function doLogin() {
  $('loginErr').textContent = '';
  const r = await fetch('/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value })
  });
  if (r.ok) { location.reload(); }
  else { const j = await r.json().catch(()=>({})); $('loginErr').textContent = j.detail || '登录失败'; }
}
$('loginBtn').onclick = doLogin;
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('logoutBtn').onclick = async () => {
  await fetch('/auth/logout', { method:'POST' }); location.reload();
};

function applyMode(m) {
  mode = m;
  document.body.classList.toggle('mode-dom', m === 'dom');
  document.body.classList.toggle('mode-stream', m === 'stream');
  $('modeBtn').textContent = m === 'dom' ? '省流模式' : '高清模式';
}
applyMode(mode);
function switchPlatform(p) {
  platform = p;
  document.querySelectorAll('.tab').forEach((t) =>
    t.classList.toggle('active', t.dataset.platform === p));
  connect(p);
}
function setStatus(text, cls) {
  const el = $('statusbar');
  el.textContent = text;
  el.className = cls || '';
}
$('modeBtn').onclick = () => {
  applyMode(mode === 'dom' ? 'stream' : 'dom');
  if (platform) connect(platform);
};
$('newChat').onclick = () => controlAction('new_chat');
$('reload').onclick = () => controlAction('reload');
function controlAction(action) {
  if (mode === 'dom' && dom && dom.transport) {
    dom.transport.send('sg:control', { action });
  } else if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type:'control', action }));
  }
}

// ===========================================================================
// DOM mirror (PhantomStream)
// ===========================================================================
let dom = null;   // { viewer, transport, lifecycle, control }

async function connectDom(p) {
  disconnectDom();
  setStatus('正在连接 ' + (platformLabels[p] || p) + '…');
  const { createViewer, mapHostPointToViewport } =
    await import(`${VENDOR}/renderer/index.js`);
  const { createWebSocketTransport } =
    await import(`${VENDOR}/transport/websocket.js`);
  const { REMOTE_CONTROL } = await import(`${VENDOR}/protocol/index.js`);
  window.__psMap = mapHostPointToViewport;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/pws?platform=${encodeURIComponent(p)}`
            + `&room=${encodeURIComponent((me.username || 'u') + ':' + p)}&role=viewer`;
  const logger = { info(){}, warn(){}, error(){ console.warn('[PhantomStream]', ...arguments); } };
  const inner = createWebSocketTransport({ url, role: 'viewer', logger });
  const control = { state: 'locked', seq: 0 };
  const transport = {
    send: (t, payload) => inner.send(t, payload),
    flush: () => inner.flush && inner.flush(),
    onMessage: (h) => inner.onMessage((t, payload) => {
      if (t === REMOTE_CONTROL.STATE) { setControlState((payload || {}).state || 'locked'); return; }
      if (t.indexOf('sg:') === 0) { handleSg(t, payload || {}); return; }
      h(t, payload);
    }),
    onStatus: (h) => inner.onStatus(h),
    close: () => inner.close && inner.close(),
    getHealth: () => inner.getHealth ? inner.getHealth() : {},
  };
  const viewer = createViewer({
    container: stage,
    transport,
    disconnectDelayMs: 4000,
    mediaMode: 'reference',
    // The viewer's own host serves /resource; widen the asset gate for it so
    // same-origin relayed media (which carries the shared session cookies) is
    // allowed even on LAN/loopback hosts.
    allowAssetOrigins: [location.hostname],
    logger,
  });
  const lifecycle = { state: 'connecting' };
  dom = { viewer, transport, control, lifecycle, RC: REMOTE_CONTROL };

  viewer.on('state', (ev) => {
    lifecycle.state = ev.state;
    if (ev.state === 'live') {
      setStatus('已连接 · 点击画面即可操作', 'ok');
      requestControl();
    } else if (ev.state === 'stale') {
      setStatus('正在刷新画面…', 'err');
    } else if (ev.state === 'disconnected') {
      setStatus('连接已断开，等待重连…', 'err');
    }
  });
  transport.onStatus((s) => {
    if (s.state === 'open') {
      transport.send('dash:dom-stream-start', { trigger: 'viewer-open' });
    }
  });

  function setControlState(s) {
    control.state = s;
    stage.classList.toggle('control-active', s === 'active');
    if (s === 'active') setStatus('已连接 · 可直接操作', 'ok');
  }
  function requestControl() {
    if (lifecycle.state !== 'live' || control.state === 'requesting'
        || control.state === 'active') return;
    control.seq += 1;
    control.state = 'requesting';
    transport.send(REMOTE_CONTROL.REQUEST, {
      requestId: 'viewer-' + Date.now().toString(36) + '-' + control.seq,
      authorizationMode: 'approve',
    });
  }
  window.__psRequestControl = requestControl;
  window.__psControl = () => control.state;

  // sg: host channel (ready/notice/error).
  function handleSg(t, payload) {
    if (t === 'sg:ready') setStatus('已连接 · 点击画面即可操作', 'ok');
    else if (t === 'sg:notice') setStatus(payload.message || '提示', 'err');
    else if (t === 'sg:error') setStatus(payload.message || '串流错误', 'err');
  }
  window.__psSg = handleSg;

  bindDomInput(viewer, transport, REMOTE_CONTROL, mapHostPointToViewport);
}

function disconnectDom() {
  stage.classList.remove('control-active');
  if (!dom) return;
  try { dom.viewer && dom.viewer.destroy(); } catch (e) {}
  try { dom.transport && dom.transport.close(); } catch (e) {}
  dom = null;
}

// Map a host pointer event to the source page viewport coordinates.
function mapPoint(viewer, mapFn, clientX, clientY) {
  const rect = stage.getBoundingClientRect();
  const mapping = viewer.getViewportMapping();
  return mapFn({ x: clientX - rect.left, y: clientY - rect.top }, mapping.scale);
}

function bindDomInput(viewer, transport, RC, mapFn) {
  const overlay = $('poverlay');
  const isPrintable = (e) => e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  const active = () => dom && dom.control.state === 'active';
  const ring = (clientX, clientY) => {
    const r = stage.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'ps-ring';
    el.style.left = (clientX - r.left) + 'px';
    el.style.top = (clientY - r.top) + 'px';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 450);
  };
  const sendClick = (e, button) => {
    if (!active()) return;
    const pt = mapPoint(viewer, mapFn, e.clientX, e.clientY);
    if (!pt.inside) return;
    transport.send(RC.CLICK, { x: Math.round(pt.x), y: Math.round(pt.y),
                               button: button, clickCount: 1 });
    ring(e.clientX, e.clientY);
  };
  overlay.addEventListener('click', (e) => {
    overlay.focus();
    if (e.button === 0 || e.detail !== undefined) sendClick(e, 'left');
  });
  overlay.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    sendClick(e, 'right');
  });
  overlay.addEventListener('wheel', (e) => {
    if (!active()) return;
    e.preventDefault();
    const pt = mapPoint(viewer, mapFn, e.clientX, e.clientY);
    if (!pt.inside) return;
    let dx = e.deltaX, dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 33; dy *= 33; }
    else if (e.deltaMode === 2) { dx *= stage.clientWidth; dy *= stage.clientHeight; }
    transport.send(RC.SCROLL, { x: Math.round(pt.x), y: Math.round(pt.y),
                                deltaX: Math.round(dx), deltaY: Math.round(dy) });
  }, { passive: false });

  overlay.addEventListener('keydown', (e) => {
    if (!active()) return;
    if (e.isComposing) return;
    if (e.key === 'Escape') { e.preventDefault(); return; }
    const combo = e.ctrlKey || e.metaKey || e.altKey;
    if (isPrintable(e) && !combo) {
      e.preventDefault();
      transport.send(RC.TEXT, { text: e.key });
      return;
    }
    e.preventDefault();
    transport.send(RC.KEY, { key: e.key, event: 'down' });
  });
  overlay.addEventListener('keyup', (e) => {
    if (!active() || isPrintable(e)) return;
    if (e.key === 'Escape') return;
    e.preventDefault();
    transport.send(RC.KEY, { key: e.key, event: 'up' });
  });
  // Chinese / IME composition -> insert the composed text as one payload.
  overlay.addEventListener('compositionend', (e) => {
    if (active() && e.data) transport.send(RC.TEXT, { text: e.data });
  });
  overlay.setAttribute('tabindex', '0');
}

// ===========================================================================
// High-fidelity pixel streaming (/ws)
// ===========================================================================
let ws = null;
function connectStream(p) {
  disconnectStream();
  setStatus('正在连接 ' + (platformLabels[p] || p) + '…');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?platform=${encodeURIComponent(p)}`);
  const canvas = $('screen');
  const ctx = canvas.getContext('2d');
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'hello', width:stage.clientWidth, height:stage.clientHeight }));
  };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch(e){ return; }
    if (d.type === 'ready') setStatus('已连接 · 高清模式', 'ok');
    else if (d.type === 'frame') {
      canvas.width = d.width; canvas.height = d.height;
      const img = new Image();
      img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
      img.src = 'data:image/jpeg;base64,' + d.data;
    }
    else if (d.type === 'notice') setStatus(d.message || '提示', 'err');
    else if (d.type === 'error') setStatus(d.message || '串流错误', 'err');
    else if (d.type === 'control_result' && d.status === 'error')
      setStatus(d.message || '操作失败', 'err');
  };
  ws.onclose = () => setStatus('连接已断开，2 秒后重连…', 'err');
  ws.onerror = () => setStatus('连接错误', 'err');
}
function disconnectStream() {
  if (ws) { try { ws.onclose = null; ws.close(); } catch(e){} ws = null; }
}

function connect(p) {
  // Clean up both transports before switching.
  disconnectDom();
  disconnectStream();
  if (mode === 'dom') {
    connectDom(p).catch((e) => { console.error(e); setStatus('DOM 模式初始化失败', 'err'); });
  } else {
    connectStream(p);
  }
}

// Resize (debounced)
let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (mode === 'dom' && dom && dom.transport) {
      dom.transport.send('sg:resize', { width: w, height: h });
    } else if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type:'resize', width:w, height:h }));
    }
  }, 400);
}).observe(stage);

// ----- Pixel-mode input capture -----
const cap = $('capture');
function point(e) {
  const r = stage.getBoundingClientRect();
  return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
}
function modifiers(e) {
  return (e.altKey?1:0) | (e.ctrlKey?2:0) | (e.metaKey?4:0) | (e.shiftKey?8:0);
}
function sendRaw(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
stage.addEventListener('mousedown', (e) => {
  if (mode !== 'stream') return;
  cap.focus();
  const {x,y} = point(e);
  sendRaw({ type:'input', subtype:'mouseDown', x, y, button:e.button, buttons:e.buttons,
            clickCount:e.detail || 1, modifiers:modifiers(e) });
});
stage.addEventListener('mousemove', (e) => {
  if (mode !== 'stream') return;
  const {x,y} = point(e);
  sendRaw({ type:'input', subtype:'mouseMove', x, y, buttons:e.buttons, modifiers:modifiers(e) });
});
window.addEventListener('mouseup', (e) => {
  if (mode !== 'stream' || !ws || ws.readyState !== 1) return;
  const r = stage.getBoundingClientRect();
  const x = Math.round(e.clientX - r.left), y = Math.round(e.clientY - r.top);
  sendRaw({ type:'input', subtype:'mouseUp', x, y, button:e.button, buttons:e.buttons,
            modifiers:modifiers(e) });
});
stage.addEventListener('contextmenu', (e) => { if (mode === 'stream') e.preventDefault(); });
stage.addEventListener('wheel', (e) => {
  if (mode !== 'stream') return;
  e.preventDefault();
  const {x,y} = point(e);
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 33; dy *= 33; }
  else if (e.deltaMode === 2) { dx *= stage.clientWidth; dy *= stage.clientHeight; }
  sendRaw({ type:'input', subtype:'mouseWheel', x, y, deltaX:dx, deltaY:dy,
            modifiers:modifiers(e) });
}, { passive:false });
const SPECIAL = new Set(['Enter','Backspace','Tab','Delete','Escape','ArrowLeft','ArrowRight',
  'ArrowUp','ArrowDown','Home','End','PageUp','PageDown','F1','F2','F3','F4','F5','F6','F7',
  'F8','F9','F10','F11','F12','Insert']);
cap.addEventListener('keydown', (e) => {
  if (mode !== 'stream' || !ws || ws.readyState === 1 !== true) return;
  if (e.isComposing) return;
  const mods = modifiers(e);
  const combo = e.ctrlKey || e.metaKey || e.altKey;
  if (combo || SPECIAL.has(e.key)) {
    e.preventDefault();
    sendRaw({ type:'input', subtype:'keyDown', key:e.key, code:e.code, vk:e.keyCode, modifiers:mods });
    cap.value = '';
  } else if (e.key.length === 1) {
    e.preventDefault();
    sendRaw({ type:'input', subtype:'insertText', text:e.key });
  }
});
cap.addEventListener('keyup', (e) => {
  if (mode !== 'stream' || !ws || ws.readyState !== 1) return;
  const combo = e.ctrlKey || e.metaKey || e.altKey;
  if (combo || SPECIAL.has(e.key)) {
    sendRaw({ type:'input', subtype:'keyUp', key:e.key, code:e.code, vk:e.keyCode,
              modifiers:modifiers(e) });
  }
  cap.value = '';
});
cap.addEventListener('compositionend', (e) => {
  if (mode === 'stream' && e.data) sendRaw({ type:'input', subtype:'insertText', text:e.data });
  cap.value = '';
});
cap.addEventListener('input', () => { cap.value = ''; });
stage.addEventListener('click', () => { if (mode === 'stream') cap.focus(); });

// ---------------- Boot ----------------
(async function boot() {
  if (await loadMe()) showApp();
  else {
    showLogin();
    fetch('/auth/me').then(r=>r.json()).then((j) => {
      if (j.sso_enabled === false) $('dtBtn').style.display = 'none';
    }).catch(()=>{});
  }
